<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Saisie des Ventes</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Catalogue Produits */
        .catalog-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .search-bar {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .product-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgb(79 70 229 / 0.15);
        }

        .product-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f1f5f9;
        }

        .product-card h4 {
            font-size: 0.95rem;
            margin: 6px 0;
            font-weight: 600;
        }

        .product-card .price {
            color: var(--primary);
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Panier & Formulaire */
        .cart-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .cart-section h2 {
            margin-top: 0;
            font-size: 1.3rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: var(--primary);
        }

        .cart-items {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            background: #f8fafc;
            padding: 8px;
            border-radius: 8px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-item-controls button {
            background: var(--primary);
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-item-controls input {
            width: 40px;
            text-align: center;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .cart-total {
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-top: 10px;
        }

        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: #059669;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Roue de chargement (Spinner) */
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Catalogue -->
        <div class="catalog-section">
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Rechercher un produit..." oninput="filtrerProduits()">
            <div id="catalog-loading" class="loading">Chargement du catalogue...</div>
            <div id="product-grid" class="product-grid"></div>
        </div>

        <!-- Panier -->
        <div class="cart-section">
            <h2>Panier</h2>
            
            <div class="form-group">
                <label>Nom du Vendeur :</label>
                <select id="vendeur-select">
                    <option value="">-- Sélectionner un vendeur --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Réduction :</label>
                <select id="reduction-select">
                    <option value="0%">0%</option>
                    <option value="5%">5%</option>
                    <option value="10%">10%</option>
                    <option value="15%">15%</option>
                    <option value="20%">20%</option>
                    <option value="25%">25%</option>
                    <option value="30%">30%</option>
                    <option value="35%">35%</option>
                    <option value="40%">40%</option>
                </select>
            </div>

            <div id="cart-items" class="cart-items">
                <div style="color: #94a3b8; text-align: center;">Le panier est vide</div>
            </div>

            <div class="cart-total">
                <span>Total :</span>
                <span id="cart-total-price">0 $</span>
            </div>

            <button id="btn-valider" class="btn-submit" onclick="validerVente()">
                <div id="spinner" class="spinner"></div>
                <span id="btn-text">Enregistrer la vente</span>
            </button>
        </div>
    </div>

    <script>
        // METS ICI TON URL DE DÉPLOIEMENT GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby2Q61es3pFXPeCDO__3CZjeS3yZOxJsYvSklixs2uXftoW6j9nqM-RbQ79cN2Lf6A-/exec";

        let allProducts = [];
        let cart = [];

        window.onload = function() {
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    allProducts = data.produits;
                    afficherProduits(allProducts);
                    
                    const empSelect = document.getElementById('vendeur-select');
                    empSelect.innerHTML = '<option value="">-- Sélectionner un vendeur --</option>';
                    data.employes.forEach(emp => {
                        let opt = document.createElement('option');
                        opt.value = emp;
                        opt.textContent = emp;
                        empSelect.appendChild(opt);
                    });
                    document.getElementById('catalog-loading').style.display = 'none';
                })
                .catch(err => {
                    document.getElementById('catalog-loading').innerHTML = "Erreur de chargement : " + err;
                });
        };

        function afficherProduits(produits) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            produits.forEach(prod => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => ajouterAuPanier(prod.id);
                card.innerHTML = `
                    <div>
                        <img src="${prod.img}" alt="${prod.nom}" onerror="this.src='https://via.placeholder.com/150'">
                        <h4>
